# Render Blueprint – optional one-file deploy
# Docs: https://render.com/docs/blueprint-spec
# Use with: Connect repo → Render reads this file (or create services manually and use DEPLOYMENT.md)

services:
  - type: web
    name: linkclassify-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkclassify-db
          property: connectionString
      - key: SCRAPING_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
    # Health check optional
    # healthCheckPath: /api/v1/health

  - type: web
    name: linkclassify-frontend
    runtime: node
    rootDir: ./frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: linkclassify-backend
          type: web
          property: host
        # Override with full URL: https://linkclassify-backend.onrender.com
        # Render will set this automatically if using fromService, but you may need to set manually

databases:
  - name: linkclassify-db
    plan: free
    databaseName: linkclassify
    user: linkclassify
