# Render Blueprint – optional one-file deploy
# Docs: https://render.com/docs/blueprint-spec
# Use with: Connect repo → Render reads this file (or create services manually and use DEPLOYMENT.md)

services:
  - type: web
    name: linkclassify-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkclassify-db
          property: connectionString
      - key: SCRAPING_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        sync: false
    # Health check optional
    # healthCheckPath: /api/v1/health

databases:
  - name: linkclassify-db
    plan: free
    databaseName: linkclassify
    user: linkclassify
